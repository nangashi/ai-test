services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # プロジェクトフォルダを/workspaceにマウント（cachedオプションでパフォーマンス向上）
      - .:/workspace:cached
    # コンテナを起動し続けるためのコマンド
    command: sleep infinity
    # 環境変数
    environment:
      - NODE_ENV=development
