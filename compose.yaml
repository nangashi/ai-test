services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - type: bind
        source: ${PWD}
        target: /workspace
        consistency: cached
    # コンテナを起動し続けるためのコマンド
    command: sleep infinity
    # 環境変数
    environment:
      - NODE_ENV=development
